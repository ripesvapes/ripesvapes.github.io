<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ripe Vapes</title>
<script>
  // Where the printed QR code goes is the one line in target.txt (edit that
  // file, not this one). It is fetched fresh on every scan, so a change reaches
  // everyone at once even when the browser kept an old copy of this page
  // (GitHub Pages lets browsers keep it for 10 minutes).
  // If target.txt can't be read in time, visitors still land on the site.
  var FALLBACK = "https://ripesvapes.com/";
  var done = false;
  function go(url) {
    if (done) return;
    done = true;
    location.replace(/^https?:\/\//i.test(url) ? url : FALLBACK);
  }
  setTimeout(function () { go(FALLBACK); }, 4000);
  fetch("target.txt?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) { go(t.trim()); })
    .catch(function () { go(FALLBACK); });
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
  a { color: inherit; }
</style>
</head>
<body>
  <noscript>Ripe Vapes — please enable JavaScript.</noscript>
  <a href="https://ripesvapes.com/">Ripe Vapes</a>
</body>
</html>
